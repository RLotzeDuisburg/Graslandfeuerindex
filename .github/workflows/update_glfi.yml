name: Graslandfeuerindex aktualisieren

on:
  schedule:
    # Täglich um 04:25 Uhr, 06:25 Uhr und 10:25 Uhr deutscher Ortszeit.
    - cron: '25 4,6,10 * * *'
      timezone: 'Europe/Berlin'

  # Ermöglicht einen manuellen Test.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-glfi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Daten abrufen
        run: python scripts/update_glfi.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/glfi.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an data/glfi.json."
            exit 0
          fi

          git commit -m "Graslandfeuerindex aktualisiert"
          git push
